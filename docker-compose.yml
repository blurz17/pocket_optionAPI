version: '3.8'

services:
  harvester:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocket_option_harvester
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8000}:${DASHBOARD_PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
